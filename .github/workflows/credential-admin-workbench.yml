name: Credential Admin Workbench MVP
on:
  push:
    branches: [feat/credential-admin-workbench-mvp]
    paths: ["apps/ai-native-console/public/credential-admin.*","apps/ai-native-console/server.mjs","apps/ai-native-console/public/index.html","apps/ai-native-console/public/app.js","apps/ai-native-console/tests/credential-admin.test.mjs",".github/workflows/credential-admin-workbench.yml"]
  pull_request:
    paths: ["apps/ai-native-console/public/credential-admin.*","apps/ai-native-console/server.mjs","apps/ai-native-console/public/index.html","apps/ai-native-console/public/app.js","apps/ai-native-console/tests/credential-admin.test.mjs",".github/workflows/credential-admin-workbench.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: apps/ai-native-console}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check server.mjs && node --check public/credential-admin.js
      - run: node --test tests/credential-admin.test.mjs tests/console.test.mjs
