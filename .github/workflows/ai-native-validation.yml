name: AI Native 2.0 Validation

on:
  push:
    branches:
      - fix/ai-native-2.0-validation
  pull_request:
    branches:
      - fix/ai-native-2.0-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run ai-native:validate
      - run: npm run build
